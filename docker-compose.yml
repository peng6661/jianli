# ============================================
# Resume Editor - Docker Compose
# Single container: Nginx (static) + FastAPI (PDF via Edge)
# privileged: needed for swapon (creates 2GB swap at startup)
# shm_size: Edge needs large /dev/shm for rendering
# ============================================

services:
  resume-editor:
    build: .
    container_name: resume-editor
    restart: unless-stopped
    init: true                    # Use tini as PID 1 (proper zombie reaping)
    privileged: true              # Required for swapon syscall (swap creation)
    shm_size: "2gb"              # Edge rendering needs large /dev/shm
    ports:
      - "8080:80"
    environment:
      # CORS: set to your domain in production, e.g. "https://resume.example.com"
      - ALLOWED_ORIGINS=*
      - HOST=0.0.0.0
      # PDF concurrency: max simultaneous Edge processes (each ~100-150MB)
      # Server has ~435MB RAM + 512MB swap. 2 = safe, 1 = most conservative
      - MAX_CONCURRENT_PDFS=2
      # Edge virtual time budget (ms): how long to wait for images/JS
      - EDGE_VIRTUAL_TIME_BUDGET=5000
      # Per-request timeout (seconds)
      - EDGE_TIMEOUT=60
    volumes:
      # Optional: mount custom fonts for PDF rendering
      # - ./fonts:/usr/share/fonts/custom:ro
      - ./logs:/app/logs
      - swapvol:/swap             # Docker volume on host ext4, supports swapon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s           # Extra time for swap creation + Edge init
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  swapvol:
