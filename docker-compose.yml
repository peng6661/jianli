# ============================================
# Resume Editor - Docker Compose
# Single container: Nginx (static) + FastAPI (PDF)
# ============================================

services:
  resume-editor:
    build: .
    container_name: resume-editor
    restart: unless-stopped
    # Edge/Chrome needs these to run in Docker containers:
    init: true                    # Use tini as PID 1 (proper zombie reaping + signal forwarding)
    shm_size: "2gb"               # Chrome needs >64MB shared memory for rendering
    privileged: true              # DIAGNOSTIC: remove ALL restrictions to isolate the issue
    security_opt:
      - seccomp:unconfined       # Docker's default seccomp profile blocks syscalls Edge needs
      - apparmor:unconfined       # Host AppArmor profile may also block Edge
    ports:
      - "8080:80"
    environment:
      # CORS: set to your domain in production, e.g. "https://resume.example.com"
      - ALLOWED_ORIGINS=*
      - HOST=0.0.0.0
    volumes:
      # Optional: mount custom fonts for PDF rendering
      # - ./fonts:/usr/share/fonts/custom:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
