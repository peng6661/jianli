# ============================================
# Resume Editor - Docker Compose
# Single container: Nginx (static) + FastAPI (PDF via WeasyPrint)
# No browser needed — no shm_size, no seccomp, no special security
# ============================================

services:
  resume-editor:
    build: .
    container_name: resume-editor
    restart: unless-stopped
    init: true                    # Use tini as PID 1 (proper zombie reaping)
    ports:
      - "8080:80"
    environment:
      # CORS: set to your domain in production, e.g. "https://resume.example.com"
      - ALLOWED_ORIGINS=*
      - HOST=0.0.0.0
    volumes:
      # Optional: mount custom fonts for PDF rendering
      # - ./fonts:/usr/share/fonts/custom:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
