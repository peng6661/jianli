# ============================================
# Resume Editor - Docker Compose
# Single container: Nginx (static) + FastAPI (PDF via Edge/WeasyPrint)
# privileged: needed for swapon (creates 2GB swap at startup)
# shm_size: Edge needs large /dev/shm for rendering
# ============================================

services:
  resume-editor:
    build: .
    container_name: resume-editor
    restart: unless-stopped
    init: true                    # Use tini as PID 1 (proper zombie reaping)
    privileged: true              # Required for swapon syscall (swap creation)
    shm_size: "2gb"              # Edge rendering needs large /dev/shm
    ports:
      - "8080:80"
    environment:
      # CORS: set to your domain in production, e.g. "https://resume.example.com"
      - ALLOWED_ORIGINS=*
      - HOST=0.0.0.0
    volumes:
      # Optional: mount custom fonts for PDF rendering
      # - ./fonts:/usr/share/fonts/custom:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s           # Extra time for swap creation + Edge init
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
