<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="关于 - Resume Editor">
    <title>更多资料 - Resume Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.ico">
    <style>
        :root {
            --primary: #1677ff;
            --text-primary: #1f1f1f;
            --text-secondary: #434343;
            --text-tertiary: #8c8c8c;
            --bg-base: #ffffff;
            --bg-secondary: #f5f5f5;
            --border: #e5e7eb;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow-md: 0 3px 6px -4px rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.08), 0 9px 28px 8px rgba(0,0,0,0.05);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f5ff 50%, #f5f0ff 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        .container { max-width: 720px; width: 100%; }
        .card {
            background: var(--bg-base);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 48px 40px;
            margin-bottom: 24px;
        }
        h1 { font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        h1 svg { flex-shrink: 0; }
        .subtitle { font-size: 15px; color: var(--text-tertiary); margin-bottom: 32px; line-height: 1.6; }
        .section-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1.5px solid var(--primary); }
        .section-title svg { flex-shrink: 0; }
        .desc-text { font-size: 14px; line-height: 1.8; color: var(--text-secondary); margin-bottom: 16px; }
        .notice-box { background: #fff7e6; border: 1px solid #ffd591; border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 20px; }
        .notice-box .notice-title { font-size: 14px; font-weight: 600; color: #d46b08; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .notice-box p { font-size: 13px; color: #873800; line-height: 1.7; }
        .qr-section { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
        .qr-item { text-align: center; flex: 1; min-width: 180px; max-width: 240px; }
        .qr-item img { width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .qr-item img:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .qr-item .label { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-top: 10px; }
        .qr-item .desc { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; line-height: 1.5; }
        .cta-text { text-align: center; font-size: 15px; font-weight: 500; color: var(--primary); margin: 20px 0 8px; line-height: 1.6; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-tertiary); text-decoration: none; margin-top: 20px; transition: color .2s; }
        .back-link:hover { color: var(--primary); }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .feature-card {
            background: linear-gradient(135deg, var(--bg-base) 0%, #f8fafc 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            border-radius: 4px 0 0 4px;
            transition: width 0.3s ease;
        }
        .feature-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border-color: transparent;
        }
        .feature-card:hover::before {
            width: 100%;
            opacity: 0.06;
        }
        .feature-icon {
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .feature-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .feature-desc {
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        /* 图片灯箱 */
        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            cursor: pointer;
        }
        .lightbox-overlay.active { opacity: 1; visibility: visible; }
        .lightbox-overlay img {
            max-width: 90vw; max-height: 90vh;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .lightbox-overlay.active img { transform: scale(1); }

        @media (max-width: 600px) {
            body { padding: 32px 16px; }
            .card { padding: 28px 20px; }
            h1 { font-size: 22px; }
            .features-grid { grid-template-columns: 1fr; }
            .qr-section { flex-direction: column; align-items: center; }
            .qr-item { max-width: 200px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>
                <img src="logo.png" width="28" height="28" style="border-radius:8px;" alt="卡码简历"/>
                Resume Editor
            </h1>
            <div class="subtitle">一款轻量、开源的在线简历编辑器。无需注册账号，数据存储在浏览器本地，打开即可使用。</div>

            <div class="section-title" style="margin-top:24px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                核心功能
            </div>
            <div class="features-grid" id="featuresGrid"></div>

            <div class="section-title" style="margin-top:28px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                使用须知
            </div>
            <div class="notice-box">
                <div class="notice-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    不得商用
                </div>
                <p>
                    本工具仅供个人学习与交流使用，<strong>严禁用于任何商业用途</strong>。
                    未经作者许可，不得将本工具或其衍生版本用于商业目的。
                </p>
            </div>
            <p class="desc-text" style="font-size:13px;color:var(--text-tertiary);margin-top:8px;">
                本项目基于 <strong>Apache License 2.0</strong> 开源协议。
            </p>
        </div>

        <div class="card">
            <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                免费获取更多资料
            </div>
            <p class="desc-text" style="text-align:center;">关注微信公众号，添加作者微信，即可免费获取更多编程学习资源和简历模板。</p>
            <div class="cta-text">📱 扫码关注 · 免费领取资料</div>
            <div class="qr-section">
                <div class="qr-item">
                    <img src="wechat_public.bmp" alt="微信公众号二维码">
                    <div class="label">微信公众号</div>
                    <div class="desc">扫码关注获取更多资源</div>
                </div>
                <div class="qr-item">
                    <img src="wechat_qr.png" alt="作者微信二维码">
                    <div class="label">作者微信</div>
                    <div class="desc">添加好友咨询交流</div>
                </div>
            </div>
            <p style="text-align:center;font-size:13px;color:var(--text-tertiary);margin-top:20px;line-height:1.6;">
                关注公众号后回复「简历」即可领取<br>精选简历模板 &amp; 编程学习资料
            </p>
        </div>

        <div style="text-align:center;">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
                返回首页
            </a>
        </div>
    </div>

<script>
(function() {
    var features = [
        { name: '多份简历管理', desc: '创建、编辑、删除多份简历，列表卡片展示，数据自动保存至浏览器 localStorage', color: '#1677ff', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>' },
        { name: '所见即所得', desc: '左侧编辑表单，右侧实时预览，修改即刻生效', color: '#52c41a', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' },
        { name: '11个模块', desc: '基本信息、教育背景、专业技能、实习经历等，支持拖拽排序', color: '#faad14', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>' },
        { name: 'Markdown编辑', desc: '内容区支持 Markdown 语法，工具栏快捷操作', color: '#722ed1', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>' },
        { name: '5种模板', desc: '现代简约、经典商务、创意设计等五种风格自由切换', color: '#13c2c2', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>' },
        { name: '自由排版', desc: '自定义主题色、字体大小、行高、页边距等排版参数', color: '#eb2f96', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>' },
        { name: '拖拽排序', desc: '随意调整模块前后顺序，支持显示/隐藏', color: '#fa8c16', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>' },
        { name: '头像裁剪', desc: '支持 JPG/PNG 上传，裁剪后自动保存为 Base64', color: '#2f54eb', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' },
        { name: 'PDF导出', desc: '默认视图和分页视图两种模式，精确保持排版样式', color: '#a0d911', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' },
        { name: '离线可用', desc: 'Service Worker 预缓存，断网也能正常编辑', color: '#f5222d', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>' },
        { name: '一键启动', desc: '自动检测环境、安装依赖、释放端口', color: '#1890ff', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>' }
    ];

    var grid = document.getElementById('featuresGrid');
    features.forEach(function(f, i) {
        var card = document.createElement('div');
        card.className = 'feature-card';
        card.innerHTML = '<div class="feature-icon" style="background:' + f.color + '15; color:' + f.color + ';">' + f.icon + '</div>' +
            '<div class="feature-name">' + f.name + '</div>' +
            '<div class="feature-desc">' + f.desc + '</div>';
        card.style.setProperty('--accent', f.color);
        card.querySelector('::before') || null;
        card.style.cssText = '--accent:' + f.color;
        card.insertAdjacentHTML('afterbegin', '<style>.feature-card:nth-child(' + (i+1) + ')::before{background:' + f.color + ';}</style>');
        grid.appendChild(card);
    });
})();

    // 图片点击灯箱查看原图
    (function() {
        var overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';
        overlay.innerHTML = '<img src="" alt="原图查看">';
        document.body.appendChild(overlay);

        var img = overlay.querySelector('img');

        document.querySelectorAll('.qr-item img').forEach(function(el) {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                img.src = this.src;
                overlay.classList.add('active');
            });
        });

        overlay.addEventListener('click', function() {
            overlay.classList.remove('active');
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') overlay.classList.remove('active');
        });
    })();
</script>
</body>
</html>
