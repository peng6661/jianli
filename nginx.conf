# ============================================
# Resume Editor - Nginx Configuration
# Static file serving + reverse proxy to FastAPI
# ============================================

server {
    listen 80;
    server_name _;

    # Frontend static files
    root /app;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Static file caching (1 year for assets with hash-like names)
    location ~* \.(ico|png|jpg|jpeg|bmp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML files - short cache, must revalidate
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS/JS - moderate cache
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Service Worker - no cache (must always fetch latest)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API reverse proxy -> FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF export can take a while
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Allow large HTML payloads
        client_max_body_size 10m;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
